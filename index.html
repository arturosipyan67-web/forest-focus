<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forest Focus Ultimate</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4caf50;
            --bg-glass: rgba(15, 25, 15, 0.7);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            height: 100vh; display: flex; justify-content: center; align-items: center;
            background: #0a0f0a url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=1200') no-repeat center center/cover;
            color: white; overflow: hidden;
        }

        .app-container {
            background: var(--bg-glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border); border-radius: 40px;
            width: 95%; max-width: 420px; height: 90vh;
            display: flex; flex-direction: column; padding: 25px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            position: relative; overflow-y: auto;
        }

        /* Экран входа */
        #auth-screen {
            position: absolute; inset: 0; background: #0e140e; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center;
            border-radius: 40px;
        }

        /* Режимы таймера */
        .mode-selector { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
        .mode-btn { 
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #aaa;
            padding: 8px 12px; border-radius: 12px; font-size: 12px; cursor: pointer; transition: 0.3s;
        }
        .mode-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Таймер */
        .timer-circle {
            width: 180px; height: 180px; border: 4px solid rgba(255,255,255,0.05);
            border-radius: 50%; margin: 0 auto 20px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
            background: rgba(255,255,255,0.02);
        }
        .timer-val { font-size: 48px; font-weight: 300; letter-spacing: -2px; }

        /* Звуковая панель */
        .sound-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
        .sound-card {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            padding: 12px; border-radius: 16px; font-size: 20px; cursor: pointer; transition: 0.2s;
            text-align: center;
        }
        .sound-card.active { border-color: var(--primary); background: rgba(76, 175, 80, 0.2); transform: scale(1.05); }

        /* Менеджер задач */
        .tasks-container { flex-grow: 1; margin-top: 20px; text-align: left; }
        .task-input-group { display: flex; gap: 8px; margin-bottom: 15px; }
        .task-input { 
            flex-grow: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            padding: 12px; border-radius: 14px; color: white; outline: none; font-size: 14px;
        }
        .add-task-btn { background: var(--primary); border: none; width: 45px; border-radius: 14px; color: white; font-size: 24px; cursor: pointer; }
        
        .task-list { list-style: none; max-height: 120px; overflow-y: auto; }
        .task-item { 
            background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; 
            margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; font-size: 14px;
        }
        .task-item.done { opacity: 0.4; text-decoration: line-through; }
        .delete-task { color: #ff5252; font-size: 18px; margin-left: 10px; cursor: pointer; }

        /* Прогресс */
        .progress-section { margin-top: auto; padding-top: 15px; border-top: 1px solid var(--border); }
        .xp-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-top: 8px; overflow: hidden; }
        .xp-bar-fill { width: 10%; height: 100%; background: var(--primary); transition: 0.5s; }

        .btn-main {
            background: var(--primary); color: white; border: none; padding: 16px;
            border-radius: 20px; width: 100%; font-size: 18px; font-weight: 600; margin-top: 15px; 
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3); cursor: pointer;
        }
        
        .quote { font-style: italic; font-size: 11px; color: #888; margin-top: 10px; min-height: 30px; line-height: 1.3; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="auth-screen">
        <h1 style="font-size: 32px; margin-bottom: 10px;">🌲 Forest Focus</h1>
        <p style="color: #888; margin-bottom: 30px;">Твой личный лес для глубокой работы</p>
        
        <div id="g_id_onload"
             data-client_id="891111673095-plvnddomg2cfhmg98a96mbfhtfmtdkof.apps.googleusercontent.com"
             data-callback="handleAuth"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-shape="pill" data-size="large"></div>
        
        <button onclick="demoMode()" style="background: none; border: 1px solid #444; color: #666; padding: 10px 20px; border-radius: 30px; margin-top: 20px; font-size: 12px; cursor: pointer;">
            Продолжить без входа (Демо)
        </button>
    </div>

    <div class="mode-selector">
        <button class="mode-btn active" onclick="setMode(25, this)">Фокус</button>
        <button class="mode-btn" onclick="setMode(5, this)">Отдых</button>
        <button class="mode-btn" onclick="setMode(15, this)">Перерыв</button>
    </div>

    <div class="timer-circle">
        <div class="timer-val" id="time-display">25:00</div>
        <div id="status-label" style="font-size: 10px; color: #4caf50; font-weight: 600; letter-spacing: 1px;">ГОТОВ</div>
    </div>

    <div class="quote" id="quote-text">"Лес не спешит, но всё успевает."</div>

    <div class="sound-grid">
        <div class="sound-card" onclick="toggleSound('forest', this)" title="Лес">🌲</div>
        <div class="sound-card" onclick="toggleSound('rain', this)" title="Дождь">🌧️</div>
        <div class="sound-card" onclick="toggleSound('fire', this)" title="Костер">🔥</div>
        <div class="sound-card" onclick="toggleSound('ocean', this)" title="Океан">🌊</div>
        <div class="sound-card" onclick="toggleSound('birds', this)" title="Птицы">🐦</div>
        <div class="sound-card" onclick="toggleSound('off', this)" title="Выкл">🔇</div>
    </div>

    <div class="tasks-container">
        <div class="task-input-group">
            <input type="text" id="task-input" class="task-input" placeholder="Какая задача сейчас важнее?">
            <button class="add-task-btn" onclick="addTask()">+</button>
        </div>
        <ul class="task-list" id="task-list"></ul>
    </div>

    <div class="progress-section">
        <div style="display: flex; justify-content: space-between; font-size: 11px;">
            <span id="user-name">Лесник: Гость</span>
            <span>Уровень <span id="lvl">1</span></span>
        </div>
        <div class="xp-bar-bg"><div class="xp-bar-fill" id="xp-fill" style="width: 10%;"></div></div>
    </div>

    <button class="btn-main" id="start-btn" onclick="toggleTimer()">ЗАПУСТИТЬ ФОКУС</button>
</div>

<audio id="snd-forest" loop src="https://www.soundjay.com/nature/forest-wind-01.mp3"></audio>
<audio id="snd-rain" loop src="https://www.soundjay.com/nature/rain-01.mp3"></audio>
<audio id="snd-fire" loop src="https://www.soundjay.com/nature/fire-1.mp3"></audio>
<audio id="snd-ocean" loop src="https://www.soundjay.com/nature/ocean-wave-1.mp3"></audio>
<audio id="snd-birds" loop src="https://www.soundjay.com/nature/birds-chirping-01.mp3"></audio>

<script>
    let timeLeft = 25 * 60;
    let timerId = null;
    let xp = 10;
    let currentAudio = null;

    const quotes = [
        "Лес не спешит, но всё успевает.",
        "Тишина — лучший собеседник.",
        "Деревья растут медленно, но уверенно.",
        "В лесу нет Wi-Fi, но связь лучше.",
        "Будь как сосна — гибким, но крепким.",
        "Сфокусируйся на одном листе, и увидишь всё дерево."
    ];

    // --- Авторизация ---
    function handleAuth(response) {
        try {
            const data = JSON.parse(atob(response.credential.split('.')[1]));
            document.getElementById('user-name').innerText = `Лесник: ${data.given_name}`;
            document.getElementById('auth-screen').style.display = 'none';
        } catch(e) {
            console.error("Ошибка входа:", e);
            demoMode();
        }
    }

    function demoMode() {
        document.getElementById('auth-screen').style.display = 'none';
    }

    // --- Таймер ---
    function setMode(mins, btn) {
        stopTimer();
        timeLeft = mins * 60;
        updateDisplay();
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('status-label').innerText = "ГОТОВ";
    }

    function toggleTimer() {
        const btn = document.getElementById('start-btn');
        if (timerId) {
            stopTimer();
            btn.innerText = "ПРОДОЛЖИТЬ";
        } else {
            startTimer();
            btn.innerText = "ПАУЗА";
        }
    }

    function startTimer() {
        if(currentAudio) currentAudio.play();
        document.getElementById('status-label').innerText = "В ПРОЦЕССЕ";
        timerId = setInterval(() => {
            timeLeft--;
            updateDisplay();
            if(timeLeft % 60 === 0) gainXP(5); // +5 XP каждую минуту
            if (timeLeft <= 0) {
                stopTimer();
                alert("Время вышло! Ты стал мудрее.");
                location.reload();
            }
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerId);
        timerId = null;
        if(currentAudio) currentAudio.pause();
        document.getElementById('status-label').innerText = "ПАУЗА";
    }

    function updateDisplay() {
        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;
        document.getElementById('time-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // --- Звуки ---
    function toggleSound(type, el) {
        if(currentAudio) currentAudio.pause();
        document.querySelectorAll('.sound-card').forEach(c => c.classList.remove('active'));
        
        if(type === 'off') {
            currentAudio = null;
            return;
        }
        
        currentAudio = document.getElementById('snd-' + type);
        el.classList.add('active');
        if(timerId) currentAudio.play();
    }

    // --- Задачи ---
    function addTask() {
        const input = document.getElementById('task-input');
        if(!input.value.trim()) return;
        
        const li = document.createElement('li');
        li.className = 'task-item';
        li.innerHTML = `
            <div style="display:flex; align-items:center;">
                <input type="checkbox" onchange="this.parentElement.parentElement.classList.toggle('done')" style="margin-right:10px;">
                <span>${input.value}</span>
            </div>
            <span class="delete-task" onclick="this.parentElement.remove()">✕</span>
        `;
        document.getElementById('task-list').prepend(li);
        input.value = '';
    }

    // --- Прогресс ---
    function gainXP(amount) {
        xp += amount;
        if(xp >= 100) { 
            xp = 0; 
            let lvl = document.getElementById('lvl'); 
            lvl.innerText = parseInt(lvl.innerText) + 1; 
            alert("Уровень повышен! Ты настоящий мастер фокуса.");
        }
        document.getElementById('xp-fill').style.width = xp + '%';
    }

    // Случайная цитата при загрузке
    document.getElementById('quote-text').innerText = `"${quotes[Math.floor(Math.random()*quotes.length)]}"`;
</script>

</body>
</html>
