<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лесная Тишина</title>
    <script src="https://accounts.google.com/gsi/client" onerror="enableGuestMode()" async defer></script>
    <style>
        :root { --p: #4caf50; --bg: rgba(10, 20, 10, 0.85); --brd: rgba(255, 255, 255, 0.15); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            height: 100vh; display: flex; justify-content: center; align-items: center;
            background: #050a05 url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=1200') no-repeat center center/cover;
            color: white; overflow: hidden;
        }

        .panel {
            background: var(--bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--brd); border-radius: 30px;
            width: 90%; max-width: 380px; height: 80vh;
            display: flex; flex-direction: column; padding: 25px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8); position: relative;
        }

        #auth { position: absolute; inset: 0; background: #080c08; z-index: 10; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        
        .timer { font-size: 60px; font-weight: 100; margin: 20px 0; letter-spacing: -2px; }
        
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid var(--brd); padding: 15px; border-radius: 15px; font-size: 24px; cursor: pointer; }
        .card.active { border-color: var(--p); background: rgba(76, 175, 80, 0.2); }

        .inp { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--brd); padding: 12px; border-radius: 12px; color: white; margin-bottom: 10px; outline: none; }
        
        .list { list-style: none; max-height: 80px; overflow-y: auto; text-align: left; font-size: 14px; }
        .item { background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px; margin-bottom: 5px; display: flex; justify-content: space-between; }

        .btn { background: var(--p); color: white; border: none; padding: 16px; border-radius: 20px; width: 100%; font-size: 18px; font-weight: 600; cursor: pointer; margin-top: auto; }
        
        #guest-btn { display: none; margin-top: 15px; color: #666; text-decoration: underline; background: none; border: none; font-size: 12px; }
    </style>
</head>
<body>

<div class="panel">
    <div id="auth">
        <h1 style="margin-bottom: 10px;">Лесная Тишина 🌲</h1>
        <p style="color: #666; font-size: 14px; margin-bottom: 30px;">Твой личный уголок покоя</p>
        
        <div id="g_id_onload" data-client_id="891111673095-plvnddomg2cfhmg98a96mbfhtfmtdkof.apps.googleusercontent.com" data-callback="onAuth"></div>
        <div class="g_id_signin" data-type="standard"></div>
        
        <button id="guest-btn" onclick="startApp('Странник')">Войти как гость</button>
    </div>

    <div class="timer" id="disp">25:00</div>
    <div id="status" style="font-size: 10px; color: var(--p); margin-bottom: 20px;">ГОТОВ</div>

    <div class="grid">
        <div class="card" onclick="playS('forest', this)">🌲</div>
        <div class="card" onclick="playS('rain', this)">🌧️</div>
        <div class="card" onclick="playS('fire', this)">🔥</div>
        <div class="card" onclick="playS('ocean', this)">🌊</div>
        <div class="card" onclick="playS('birds', this)">🐦</div>
        <div class="card" onclick="playS('off', this)">🔇</div>
    </div>

    <input type="text" id="tInp" class="inp" placeholder="Чем займемся?">
    <div id="tList" class="list"></div>

    <button class="btn" id="go" onclick="runT()">НАЧАТЬ</button>
</div>

<audio id="a-forest" loop src="https://www.soundjay.com/nature/forest-wind-01.mp3"></audio>
<audio id="a-rain" loop src="https://www.soundjay.com/nature/rain-01.mp3"></audio>
<audio id="a-fire" loop src="https://www.soundjay.com/nature/fire-1.mp3"></audio>
<audio id="a-ocean" loop src="https://www.soundjay.com/nature/ocean-wave-1.mp3"></audio>
<audio id="a-birds" loop src="https://www.soundjay.com/nature/birds-chirping-01.mp3"></audio>

<script>
    let t = 25 * 60, sId = null, curA = null;

    // Показываем кнопку гостя через 3 сек, если Google не грузится
    setTimeout(() => { document.getElementById('guest-btn').style.display = 'block'; }, 3000);

    function onAuth(r) {
        const d = JSON.parse(atob(r.credential.split('.')[1]));
        startApp(d.given_name);
    }

    function startApp(n) {
        document.getElementById('auth').style.display = 'none';
    }

    function playS(type, el) {
        if(curA) curA.pause();
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        if(type === 'off') return;
        curA = document.getElementById('a-' + type);
        el.classList.add('active');
        if(sId) curA.play();
    }

    function runT() {
        const b = document.getElementById('go');
        if(sId) {
            clearInterval(sId); sId = null;
            b.innerText = "ПРОДОЛЖИТЬ";
            if(curA) curA.pause();
        } else {
            b.innerText = "ПАУЗА";
            if(curA) curA.play();
            sId = setInterval(() => {
                t--; update();
                if(t <= 0) { clearInterval(sId); alert("Время вышло!"); location.reload(); }
            }, 1000);
        }
    }

    function update() {
        let m = Math.floor(t / 60), s = t % 60;
        document.getElementById('disp').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    document.getElementById('tInp').onkeypress = (e) => {
        if(e.key === 'Enter' && e.target.value) {
            const d = document.createElement('div'); d.className = 'item';
            d.innerHTML = `<span>${e.target.value}</span><span onclick="this.parentElement.remove()">✕</span>`;
            document.getElementById('tList').prepend(d);
            e.target.value = '';
        }
    }
</script>
</body>
</html>
